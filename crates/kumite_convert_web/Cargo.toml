[package]
name = "kumite_convert_web"
description = "OpenKumite's game data converted in the browser: the converters in a Web Worker (web/convert_worker.js)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
kumite_packs.workspace = true
ok_converter_common = { git = "https://github.com/openkumite/ok_converter_common", branch = "main", default-features = false, features = ["disc"] }
ok_tekken3_converter = { git = "https://github.com/openkumite/ok_tekken3_converter", branch = "main" }
ok_tekken2_converter = { git = "https://github.com/openkumite/ok_tekken2_converter", branch = "main" }
ok_hl_cs_converter = { git = "https://github.com/openkumite/ok_hl_cs_converter", branch = "main" }
# (the version of wasm-bindgen-cli web/build.sh runs)
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
