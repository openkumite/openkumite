[package]
name = "kumite_convert_web"
description = "OpenKumite's game data converted in the browser: the converters in a Web Worker (web/convert_worker.js)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
kumite_packs.workspace = true
ok_converter_common = { path = "../../../../02_converters/ok_converter_common", default-features = false }
ok_tekken3_converter = { path = "../../../../02_converters/ok_tekken3_converter" }
ok_tekken2_converter = { path = "../../../../02_converters/ok_tekken2_converter" }
ok_hl_cs_converter = { path = "../../../../02_converters/ok_hl_cs_converter" }
# (the version of wasm-bindgen-cli web/build.sh runs)
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
