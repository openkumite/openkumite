# The Nix flake (flake.nix, Linux only): it evaluates for both systems, and builds (with the tests that run without the
# game data) on x86-64. Only when what it builds from changes.
name: nix

# shortcut: the Linux (Nix) build is off for pull requests and pushes for faster results (the user's request,
# 2026-11-18); run it by hand (workflow_dispatch); back with the pull_request / push triggers below.
#  pull_request:
#    paths: [flake.nix, flake.lock, Cargo.lock, "**/Cargo.toml", .github/workflows/nix.yml]
#  push:
#    branches: [main]
#    paths: [flake.nix, flake.lock, Cargo.lock, "**/Cargo.toml", .github/workflows/nix.yml]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - run: nix flake check --all-systems
      - run: nix build -L
      - run: ./result/bin/openkumite --help
