# The Nix flake (flake.nix, Linux only): it evaluates for both systems, and builds (with the tests that run without the
# game data) on x86-64. By hand only (Actions, nix, Run workflow).
name: nix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems
      - run: nix build -L
      - run: ./result/bin/openkumite --help
