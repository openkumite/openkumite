# The checks a pull request must pass to be merged into main (the branch's ruleset requires `linux`), as check.sh does
# them: rustfmt, clippy with warnings as errors (native, the browser build), cargo deny, the tests — on Linux only.
# The tests on Windows and macOS run at a release (release.yml calls this before it publishes) or by hand (Actions,
# ci, Run workflow); the Android APK and the packages are built by release.yml alone (by hand too). The tests that
# read the converted game data skip themselves here (there is none: it is copyrighted).
# A change of only Markdown and LICENSE* files runs no CI at all; such a PR is merged with the admin bypass.
name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "**/LICENSE*", "LICENSE*"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "**/LICENSE*", "LICENSE*"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - name: clippy (browser build)
        run: cargo clippy --release --target wasm32-unknown-unknown -p openkumite -- -D warnings
      - run: cargo deny --log-level error check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release

  test:
    # (a release's tag, or by hand; in a call from release.yml, github is the caller's)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # (macOS on Intel: GitHub's Apple Silicon runners are often out of capacity)
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test --workspace --release
